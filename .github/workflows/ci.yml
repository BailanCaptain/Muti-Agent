name: CI Gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # DocsWatcher 默认 chokidar 工厂的真 fs 端到端门禁（范-r1 flaky P2-1）。
  # 单独 job 串行跑（无并发饿死），故可从上面并行 `pnpm test` 排除，但默认生产路径必须有此门禁，
  # 否则 import/options 兼容性/工厂返回值回归会 typecheck + 必跑测试双绿漏过。
  docs-watcher-fs-smoke:
    name: DocsWatcher FS Smoke (serial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real-chokidar integration smoke (default factory gate)
        env:
          DOCS_WATCHER_FS_IT: "1"
        run: pnpm exec tsx --test packages/api/src/services/scheduler/docs-watcher.test.ts

  # F038 · Playwright E2E（真浏览器点击流全链路）。
  # 起步为非阻塞（continue-on-error）——新 E2E 直接进硬门禁易假红拖垮全队（docs-watcher flaky 教训）。
  # 升级条件（TD-F038-1，owner 黄仁勋）：主干连续 20 次运行全绿（或 2026-08-01 前无 flake 记录）
  # → 删掉 continue-on-error 升为硬门禁；到期未达标则回 F038 doc 记录原因再续期。
  e2e:
    name: E2E (Playwright, non-blocking rollout)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - name: Upload traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test-results/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  doc-check:
    name: Doc Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-docs.sh

  adr-guard:
    name: ADR-004 Diff Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base against dev/origin/main requires the full history
          fetch-depth: 0
      - name: Run ADR-004 diff guard
        env:
          # PRs: diff against the PR base branch (usually origin/dev).
          # Push-to-dev/main: fall back to origin/dev — the real fork source
          # for Multi-Agent feature branches (origin/main只到 Initial commit).
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/dev' }}
        run: bash scripts/ci/check-adr-004-diff.sh
